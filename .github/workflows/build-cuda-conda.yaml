name: Build CUDA Conda Images

on:
  push:
    branches: [ main ]
    paths:
      - 'cuda-conda/Dockerfile'
      - '**/.github/workflows/build-cuda-conda.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cuda-conda/Dockerfile'
      - '**/.github/workflows/build-cuda-conda.yaml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # CUDA 11.8 - Ubuntu 22.04
          - { cuda_version: '11.8.0', ubuntu_version: '22.04', python_version: '3.8' }
          - { cuda_version: '11.8.0', ubuntu_version: '22.04', python_version: '3.9' }
          - { cuda_version: '11.8.0', ubuntu_version: '22.04', python_version: '3.10' }
          - { cuda_version: '11.8.0', ubuntu_version: '22.04', python_version: '3.11' }
          - { cuda_version: '11.8.0', ubuntu_version: '22.04', python_version: '3.12' }
          # CUDA 12.1 - Ubuntu 22.04
          - { cuda_version: '12.1.1', ubuntu_version: '22.04', python_version: '3.8' }
          - { cuda_version: '12.1.1', ubuntu_version: '22.04', python_version: '3.9' }
          - { cuda_version: '12.1.1', ubuntu_version: '22.04', python_version: '3.10' }
          - { cuda_version: '12.1.1', ubuntu_version: '22.04', python_version: '3.11' }
          - { cuda_version: '12.1.1', ubuntu_version: '22.04', python_version: '3.12' }
          # CUDA 12.4 - Ubuntu 22.04
          - { cuda_version: '12.4.1', ubuntu_version: '22.04', python_version: '3.8' }
          - { cuda_version: '12.4.1', ubuntu_version: '22.04', python_version: '3.9' }
          - { cuda_version: '12.4.1', ubuntu_version: '22.04', python_version: '3.10' }
          - { cuda_version: '12.4.1', ubuntu_version: '22.04', python_version: '3.11' }
          - { cuda_version: '12.4.1', ubuntu_version: '22.04', python_version: '3.12' }
          # CUDA 12.6 - Ubuntu 24.04
          - { cuda_version: '12.6.3', ubuntu_version: '24.04', python_version: '3.9' }
          - { cuda_version: '12.6.3', ubuntu_version: '24.04', python_version: '3.10' }
          - { cuda_version: '12.6.3', ubuntu_version: '24.04', python_version: '3.11' }
          - { cuda_version: '12.6.3', ubuntu_version: '24.04', python_version: '3.12' }
          # CUDA 12.8 - Ubuntu 22.04
          - { cuda_version: '12.8.1', ubuntu_version: '22.04', python_version: '3.9' }
          - { cuda_version: '12.8.1', ubuntu_version: '22.04', python_version: '3.10' }
          - { cuda_version: '12.8.1', ubuntu_version: '22.04', python_version: '3.11' }
          - { cuda_version: '12.8.1', ubuntu_version: '22.04', python_version: '3.12' }
          # CUDA 12.8 - Ubuntu 24.04
          - { cuda_version: '12.8.1', ubuntu_version: '24.04', python_version: '3.9' }
          - { cuda_version: '12.8.1', ubuntu_version: '24.04', python_version: '3.10' }
          - { cuda_version: '12.8.1', ubuntu_version: '24.04', python_version: '3.11' }
          - { cuda_version: '12.8.1', ubuntu_version: '24.04', python_version: '3.12' }
          # CUDA 12.9 - Ubuntu 22.04
          - { cuda_version: '12.9.0', ubuntu_version: '22.04', python_version: '3.9' }
          - { cuda_version: '12.9.0', ubuntu_version: '22.04', python_version: '3.10' }
          - { cuda_version: '12.9.0', ubuntu_version: '22.04', python_version: '3.11' }
          - { cuda_version: '12.9.0', ubuntu_version: '22.04', python_version: '3.12' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cuda-conda
          file: ./cuda-conda/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/cuda-conda:${{ matrix.cuda_version }}-ubuntu${{ matrix.ubuntu_version }}-python${{ matrix.python_version }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            PYTHON_VERSION=${{ matrix.python_version }}